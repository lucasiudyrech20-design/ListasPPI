    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            width: 95%;
            height: 90%;
            display: flex;
            gap: 10px;
        }

        .lateral {
            width: 8%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
          .lateral img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 25px;
        }

        .principal {
            width: 65%;
            border-radius: 25px;
            overflow: hidden;
        }
        .principal img, .caixa img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .caixa {
            flex: 1;
            border-radius: 25px;
            overflow: hidden;
        }

        .direita {
            width: 27%;
            display: flex;
            gap: 10px;
        }





      

        .inferior {
            height: 100%;
            position: relative;
        }

        .texto {
            position: absolute;
            bottom: 15px;
            left: 20px;
            color: white;
        }
    </style>
</head>
