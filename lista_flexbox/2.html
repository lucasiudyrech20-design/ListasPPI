<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
         body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page{
            width: 100%;
            height: 100%;
            border: 5px solid purple;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo{
            margin-top: 20px;
        }

        .campos{
            width: 60%;
            margin-top: 28px;

            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .campo{
            height: 15px;
            background-color: #e5e5e5;
            border-radius: 3px;
        }

        .usuario{
            margin-top: auto;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .foto{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #e5e5e5;
        }

        .botao{
            width: 140px;
            height: 25px;
            background-color: #e5e5e5;
            border-radius: 3px;
            margin-bottom: 20px;
        }

    </style>
</head>

<body>

    <div class="page">

        <div class="logo">
            Company Logo
        </div>

        <div class="campos">
            <div class="campo"></div>
            <div class="campo"></div>
            <div class="campo"></div>
            <div class="campo"></div>
        </div>

        <div class="usuario">
            <div class="foto"></div>
            <div class="botao"></div>
        </div>

    </div>

</body>
</html>
