<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>

    <style>
        .page{display: flex;
            height: 100vh;
            flex-direction: column;}

        header{
            height: 80px;
            background-color: yellowgreen;
            padding: 15px;
        }

        main{
            flex: 1;
            display: flex;
        }

        article{
            flex: 1;
            padding: 15px;
        }

        aside{
            width: 20%;
            background-color: beige;
            padding: 15px;
        }

        nav{
            width: 20%;
            background-color: #dcebd8;
            padding: 15px;
        }

        footer{
            height: 50px;
            background-color: yellowgreen;
            padding: 15px;
        }

    </style>
</head>

<body>
    <div class="page">
        <header>Header</header>

        <main>
            <article>Article</article>
            <aside>Aside</aside>
            <nav>Nav</nav>
        </main>

        <footer>Footer</footer>
    </div>
</body>
</html>
