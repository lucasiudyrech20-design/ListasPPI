<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .page {display: grid;
            grid-template-areas:
                "A A . B"
                "C D D D";

            grid-template-columns: 3fr 2fr 2fr 2fr;
            grid-template-rows: 1fr 2fr;
            gap: 8px;
            width: 400px;
            margin: 8px auto;
        }

        #A { grid-area: A;  }
        #B { grid-area: B;  }
        #C { grid-area: C; }
        #D { grid-area: D;
            display: grid;
                grid-template-areas:
                "E F G"
                "M I J";
            grid-template-columns: 60px 1fr 60px;
            grid-template-rows: 1fr 1fr;

            gap: 7px;

            padding: 15px;
        }
        #E { grid-area: E; }
        #F { grid-area: F; }
        #G { grid-area: G; }
        #M { grid-area: M; }
        #I { grid-area: I; }
        #J { grid-area: J; }

        .box {
            background-color: #444;
            color: white;
            padding: 15px;
            border-radius: 3px;
        }

        .inside {
            background-color: #ccc;
            color: #444;
            padding: 15px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="page">

        <div id="A" class="box">A</div>
        <div id="B" class="box">B</div>
        <div id="C" class="box">C</div>
        <div id="D" class="box">
            <div id="E" class="inside">E</div>
            <div id="F" class="inside">F</div>
            <div id="G" class="inside">G</div>
            <div id="M" class="inside">M</div>
            <div id="I" class="inside">I</div>
            <div id="J" class="inside">J</div>

        </div>

    </div>

</body>
</html>
